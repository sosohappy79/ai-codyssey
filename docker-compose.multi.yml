
services:
  web-app:
    build: .
    container_name: multi-web-app
    ports:
      - "8083:80"
    networks:
      - app-net

  redis-cache:
    image: redis:alpine
    container_name: multi-redis-cache
    ports:
      - "6379:6379"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge